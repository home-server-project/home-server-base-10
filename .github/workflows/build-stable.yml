---
name: stable

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'

concurrency:
  group: ${{ github.workflow }}-stable
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/home-server-base-10
  IMAGE_CHANNEL: 'stable'
  BASE_MANIFEST: 'almalinux-10-minimal-plus'
  BASE_PROFILE: 'almalinux-10-minimal-plus'
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'
  ALMA_REPOS_IMAGE: quay.io/almalinuxorg/10-base:10
  BOOTC_IMAGECTL_IMAGE: quay.io/centos-bootc/centos-bootc:stream10
  ALMA_BUILDER_IMAGE: quay.io/almalinuxorg/10-kitten-base:10-kitten
  NM_HSP_IMAGE: ghcr.io/home-server-project/nm-hsp:stable

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            platform: linux/amd64
            upstream_arch: amd64
            upstream_variant: ''
            rpm_arch: x86_64
            microarch: v3
            current_tag: stable
            immutable_prefix: stable
          - name: x86_64_v2
            platform: linux/amd64/v2
            upstream_arch: amd64
            upstream_variant: v2
            rpm_arch: x86_64_v2
            microarch: v2
            current_tag: stable-v2
            immutable_prefix: stable-v2

    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Resolve stable source revision
        shell: bash
        run: |
          set -euo pipefail
          stable_sha="$(git rev-parse HEAD)"
          [[ "${stable_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "STABLE_SHA=${stable_sha}" >> "${GITHUB_ENV}"
          echo "Stable source revision: ${stable_sha}"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Resolve upstream build inputs
        id: inputs
        shell: bash
        env:
          UPSTREAM_ARCH: ${{ matrix.upstream_arch }}
          UPSTREAM_VARIANT: ${{ matrix.upstream_variant }}
        run: |
          set -euo pipefail

          resolve_ref() {
            local image="$1"
            local arch="$2"
            local variant="${3:-}"
            local digest
            local -a inspect_args=(--override-arch "${arch}")

            if [[ -n "${variant}" ]]; then
              inspect_args+=(--override-variant "${variant}")
            fi

            if ! digest="$(skopeo inspect --retry-times 3 \
              "${inspect_args[@]}" \
              --format '{{.Digest}}' \
              "docker://${image}")"; then
              echo "ERROR: failed to resolve upstream image digest: ${image}" >&2
              return 1
            fi

            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: invalid digest returned for ${image}: '${digest}'" >&2
              return 1
            fi

            printf '%s@%s' "${image%:*}" "${digest}"
          }

          # Alma repository metadata and the builder are platform-sensitive so
          # x86_64_v2 resolves the v2 manifests. bootc imagectl is a build tool,
          # not the source of the composed Alma rootfs, so keep its proven amd64
          # input identical for both matrix entries.
          repos_ref="$(resolve_ref "${ALMA_REPOS_IMAGE}" "${UPSTREAM_ARCH}" "${UPSTREAM_VARIANT}")"
          imagectl_ref="$(resolve_ref "${BOOTC_IMAGECTL_IMAGE}" amd64)"
          builder_ref="$(resolve_ref "${ALMA_BUILDER_IMAGE}" "${UPSTREAM_ARCH}" "${UPSTREAM_VARIANT}")"

          echo "Build platform: ${{ matrix.platform }}"
          echo "Alma repository image: ${repos_ref}"
          echo "bootc imagectl image: ${imagectl_ref}"
          echo "Alma builder image: ${builder_ref}"
          echo "nm-hsp package channel: ${NM_HSP_IMAGE}"

          echo "repos_ref=${repos_ref}" >> "${GITHUB_OUTPUT}"
          echo "imagectl_ref=${imagectl_ref}" >> "${GITHUB_OUTPUT}"
          echo "builder_ref=${builder_ref}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        shell: bash
        env:
          ALMA_REPOS_REF: ${{ steps.inputs.outputs.repos_ref }}
          BOOTC_IMAGECTL_REF: ${{ steps.inputs.outputs.imagectl_ref }}
          ALMA_BUILDER_REF: ${{ steps.inputs.outputs.builder_ref }}
        run: |
          set -euo pipefail
          sudo podman build \
            --platform "${{ matrix.platform }}" \
            --pull=always \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --build-arg "ALMA_REPOS_IMAGE=${ALMA_REPOS_REF}" \
            --build-arg "BOOTC_IMAGECTL_IMAGE=${BOOTC_IMAGECTL_REF}" \
            --build-arg "ALMA_BUILDER_IMAGE=${ALMA_BUILDER_REF}" \
            --build-arg "NM_HSP_IMAGE=${NM_HSP_IMAGE}" \
            --build-arg "IMAGE_CHANNEL=${IMAGE_CHANNEL}" \
            --build-arg "BASE_MANIFEST=${BASE_MANIFEST}" \
            --build-arg "BASE_PROFILE=${BASE_PROFILE}" \
            --label "org.opencontainers.image.revision=${STABLE_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "io.home-server-project.base.arch=${{ matrix.name }}" \
            --label "io.home-server-project.base.microarch=${{ matrix.microarch }}" \
            --tag home-server-base-10:unrechunked \
            --file Containerfile \
            .

      - name: Rechunk image
        id: rechunk
        shell: bash
        run: |
          set -euo pipefail

          rechunk_tmp="${RUNNER_TEMP}/home-server-base-10-rechunk-${{ matrix.name }}"
          sudo mkdir -p "${rechunk_tmp}"
          sudo chmod 1777 "${rechunk_tmp}"

          df -h "${RUNNER_TEMP}" /var/lib/containers

          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v "${rechunk_tmp}:/var/tmp" \
            --entrypoint /usr/libexec/bootc-base-imagectl \
            localhost/home-server-base-10:unrechunked \
            rechunk \
            --max-layers "${RECHUNK_MAX_LAYERS}" \
            localhost/home-server-base-10:unrechunked \
            localhost/home-server-base-10:test

          layer_count="$(
            sudo skopeo inspect --raw \
              containers-storage:localhost/home-server-base-10:test \
              | jq -r '.layers | length'
          )"

          [[ "${layer_count}" =~ ^[0-9]+$ ]]
          if (( layer_count > OCI_LAYER_LIMIT )); then
            echo "ERROR: rechunked image has ${layer_count} layers; OCI maximum is ${OCI_LAYER_LIMIT}" >&2
            exit 1
          fi

          echo "layers=${layer_count}" >> "${GITHUB_OUTPUT}"
          echo "Rechunked image layers: ${layer_count} / OCI max ${OCI_LAYER_LIMIT}"

      - name: Validate completed image
        shell: bash
        env:
          EXPECTED_RPM_ARCH: ${{ matrix.rpm_arch }}
          EXPECTED_IMAGE_ARCH: ${{ matrix.name }}
          EXPECTED_MICROARCH: ${{ matrix.microarch }}
        run: |
          set -euo pipefail
          sudo podman run --rm \
            -e "EXPECTED_RPM_ARCH=${EXPECTED_RPM_ARCH}" \
            -e "EXPECTED_IMAGE_ARCH=${EXPECTED_IMAGE_ARCH}" \
            -e "EXPECTED_MICROARCH=${EXPECTED_MICROARCH}" \
            --entrypoint /bin/bash \
            home-server-base-10:test \
            -c '
              set -euo pipefail
              bootc container lint --fatal-warnings
              /usr/libexec/home-server-base/health/identity
              rpm -q almalinux-repos
              command -v bootc
              command -v dnf
              test -f /usr/lib/bootc/install/20-rhel.toml
              grep -Fqx "root-fs-type = \"xfs\"" /usr/lib/bootc/install/20-rhel.toml
              dnf repolist --enabled | grep -Eiq "(^|[[:space:]])baseos([[:space:]]|$)"
              dnf repolist --enabled | grep -Eiq "(^|[[:space:]])appstream([[:space:]]|$)"

              glibc_arch="$(rpm -q --qf "%{ARCH}\\n" glibc | head -n1)"
              if [[ "${glibc_arch}" != "${EXPECTED_RPM_ARCH}" ]]; then
                echo "ERROR: glibc RPM architecture is ${glibc_arch}; expected ${EXPECTED_RPM_ARCH}" >&2
                exit 1
              fi

              echo "Validated RPM architecture: ${glibc_arch}"
              echo "Expected image architecture label: ${EXPECTED_IMAGE_ARCH}"
              echo "Expected microarchitecture: ${EXPECTED_MICROARCH}"
            '

          arch_label="$(sudo podman image inspect home-server-base-10:test \
            --format '{{ index .Labels "io.home-server-project.base.arch" }}')"
          microarch_label="$(sudo podman image inspect home-server-base-10:test \
            --format '{{ index .Labels "io.home-server-project.base.microarch" }}')"
          [[ "${arch_label}" == "${EXPECTED_IMAGE_ARCH}" ]]
          [[ "${microarch_label}" == "${EXPECTED_MICROARCH}" ]]
          echo "Validated image labels: arch=${arch_label}, microarch=${microarch_label}"

      - name: Prepare stable tags
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${STABLE_SHA:0:7}"
          build_tag="${{ matrix.immutable_prefix }}-$(date -u +%Y%m%d)-${short_sha}"
          echo "BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"
          echo "CURRENT_TAG=${{ matrix.current_tag }}" >> "${GITHUB_ENV}"
          echo "Publishing ${IMAGE_REPOSITORY}:${{ matrix.current_tag }} and ${IMAGE_REPOSITORY}:${build_tag}"

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Push stable image
        id: push
        shell: bash
        run: |
          set -euo pipefail

          sudo podman tag home-server-base-10:test "${IMAGE_REPOSITORY}:${BUILD_TAG}"
          sudo podman tag home-server-base-10:test "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/digest \
            "${IMAGE_REPOSITORY}:${BUILD_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          digest="$(cat /tmp/digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Published ${CURRENT_TAG} digest: ${digest}"

      - name: Sign image digest
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify published signature
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Build summary
        if: always()
        shell: bash
        env:
          REPOS_REF: ${{ steps.inputs.outputs.repos_ref }}
          IMAGECTL_REF: ${{ steps.inputs.outputs.imagectl_ref }}
          BUILDER_REF: ${{ steps.inputs.outputs.builder_ref }}
          RECHUNK_LAYERS: ${{ steps.rechunk.outputs.layers }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '## Home Server Base 10 stable'
            echo
            echo "- Source branch: main"
            echo "- Source revision: ${STABLE_SHA:-unknown}"
            echo "- Product identity: Home Server Base 10"
            echo "- Base profile: AlmaLinux 10 minimal-plus"
            echo "- Build platform: ${{ matrix.platform }}"
            echo "- RPM architecture: ${{ matrix.rpm_arch }}"
            echo "- CPU microarchitecture baseline: ${{ matrix.microarch }}"
            echo "- Alma repository source: ${REPOS_REF:-unknown}"
            echo "- bootc imagectl source: ${IMAGECTL_REF:-unknown}"
            echo "- Alma builder source: ${BUILDER_REF:-unknown}"
            echo "- nm-hsp package channel: ${NM_HSP_IMAGE}"
            echo "- Rechunked layers: ${RECHUNK_LAYERS:-unknown} / OCI max ${OCI_LAYER_LIMIT}"
            if [[ -n "${PUBLISHED_DIGEST:-}" ]]; then
              echo "- Published tag: ${IMAGE_REPOSITORY}:${CURRENT_TAG:-unknown}"
              echo "- Immutable tag: ${IMAGE_REPOSITORY}:${BUILD_TAG:-unknown}"
              echo "- Published digest: ${IMAGE_REPOSITORY}@${PUBLISHED_DIGEST}"
            else
              echo '- Published: no image published'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    name: cleanup
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
      - name: Remove expired stable images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: home-server-base-10
          delete-tags: 'stable-*'
          exclude-tags: 'stable,stable-v2,testing,testing-*,next,next-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true

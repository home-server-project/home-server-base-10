releasever: 10

repos:
  - baseos
  - appstream

variables:
  distro: "almalinux10"

# Build from AlmaLinux's bootc minimal-plus content tier. Keep only the shared
# system behavior required by Home Server Base 10; appliance features belong in
# downstream images.
include:
  - minimal-plus/manifest.yaml
  - standard/system-configuration.yaml
  - standard/persistent-journal.yaml
  - standard/generic-growfs.yaml

packages:
  - almalinux-repos

postprocess:
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    mkdir -p /usr/lib/bootc/install/
    cat > /usr/lib/bootc/install/20-rhel.toml << EOF_INSTALL
    [install]
    root-fs-type = "xfs"
    EOF_INSTALL
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    # AlmaLinux bootc currently does not ship the bootc dracut module expected
    # by newer bootc-base manifests. Match the proven downstream workaround.
    DRACUT_CONF="/usr/lib/dracut/dracut.conf.d/20-bootc-base.conf"
    if [ -f "${DRACUT_CONF}" ]; then
      sed -i 's/ bootc / /' "${DRACUT_CONF}"
    fi
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    dnf clean all
    rm /var/{log,cache,lib}/* -rf
    systemctl preset-all
